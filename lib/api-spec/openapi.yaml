openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API для управления игровой фракцией
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: members
  - name: events
  - name: standards
  - name: standard-assignments
  - name: tasks
  - name: discipline
  - name: audit
  - name: storage
  - name: notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Проверка доступности API
      responses:
        "200":
          description: API работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/setup-status:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Проверить и при необходимости завершить начальную настройку первого лидера
      responses:
        "200":
          description: Состояние первоначальной настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Войти в аккаунт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Неверные данные или аккаунт заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Получить текущий аккаунт
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Завершить текущую сессию
      responses:
        "200":
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Сменить пароль текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Пароль изменён, активные сессии обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Некорректный пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Сводка штаба и последние события
      responses:
        "200":
          description: Сводная информация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Список сотрудников с учётом роли
      responses:
        "200":
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Создать сотрудника и сгенерировать временный пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Аккаунт создан; временный пароль показывается только один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCredentials"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /members/{id}:
    patch:
      operationId: updateMember
      tags: [members]
      summary: Изменить роль, звание или статус сотрудника
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Сотрудник обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Исключить сотрудника из состава без удаления истории
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник исключён из состава
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: Недостаточно прав или нельзя удалить эту роль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Список мероприятий
      responses:
        "200":
          description: Мероприятия
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Создать мероприятие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Мероприятие создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Изменить мероприятие
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Мероприятие обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Удалить мероприятие
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Мероприятие удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /events/{id}/submissions:
    get:
      operationId: listEventSubmissions
      tags: [events]
      summary: Отчёты по мероприятию (сотруднику доступны только его отчёты)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Отчёты по мероприятию
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSubmission"
    post:
      operationId: submitEventSubmission
      tags: [events]
      summary: Отправить скриншоты отчёта по мероприятию
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSubmissionInput"
      responses:
        "201":
          description: Отчёт отправлен на проверку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubmission"
  /event-submissions/{id}/review:
    patch:
      operationId: reviewEventSubmission
      tags: [events]
      summary: Проверить отчёт по мероприятию
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSubmissionReviewInput"
      responses:
        "200":
          description: Решение по отчёту сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubmission"
  /standards:
    get:
      operationId: listStandards
      tags: [standards]
      summary: Список нормативов
      responses:
        "200":
          description: Нормативы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standard"
    post:
      operationId: createStandard
      tags: [standards]
      summary: Создать норматив
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardInput"
      responses:
        "201":
          description: Норматив создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standard"
  /standards/{id}:
    patch:
      operationId: updateStandard
      tags: [standards]
      summary: Изменить норматив
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardUpdate"
      responses:
        "200":
          description: Норматив обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standard"
    delete:
      operationId: deleteStandard
      tags: [standards]
      summary: Удалить норматив
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Норматив удалён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /standard-assignments:
    get:
      operationId: listStandardAssignments
      tags: [standard-assignments]
      summary: Список назначенных нормативов с учётом роли
      responses:
        "200":
          description: Назначенные нормативы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandardAssignment"
    post:
      operationId: createStandardAssignment
      tags: [standard-assignments]
      summary: Назначить норматив сотруднику
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardAssignmentInput"
      responses:
        "201":
          description: Норматив назначен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardAssignment"
  /standard-assignments/{id}/submissions:
    get:
      operationId: listStandardSubmissions
      tags: [standard-assignments]
      summary: История всех версий сдачи норматива
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Версии сдачи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StandardSubmission" }
    post:
      operationId: submitStandard
      tags: [standard-assignments]
      summary: Отправить или пересдать норматив
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardSubmissionInput" }
      responses:
        "201":
          description: Версия отправлена на проверку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardSubmission" }
  /standard-submissions/{id}/review:
    patch:
      operationId: reviewStandardSubmission
      tags: [standard-assignments]
      summary: Проверить норматив и сохранить результат с обязательной причиной
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandardReviewInput" }
      responses:
        "200":
          description: Результат проверки сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardSubmission" }
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Список заданий с учётом роли и назначений
      responses:
        "200":
          description: Задания
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Создать задание
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Задание создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Изменить статус, исполнителя или сведения задания
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Задание обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Удалить задание
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Задание удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /tasks/{id}/submissions:
    get:
      operationId: listTaskSubmissions
      tags: [tasks]
      summary: История всех версий выполнения задания
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Версии выполнения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskSubmission" }
    post:
      operationId: submitTask
      tags: [tasks]
      summary: Отправить или пересдать задание
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskSubmissionInput" }
      responses:
        "201":
          description: Выполнение отправлено на проверку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSubmission" }
  /task-submissions/{id}/review:
    patch:
      operationId: reviewTaskSubmission
      tags: [tasks]
      summary: Проверить выполнение задания
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskReviewInput" }
      responses:
        "200":
          description: Результат проверки сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSubmission" }
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Отменить задание без удаления истории
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCancelInput" }
      responses:
        "200":
          description: Задание отменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
  /discipline:
    get:
      operationId: listDiscipline
      tags: [discipline]
      summary: Записи дисциплины с учётом роли
      parameters:
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [warning, reprimand] }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked, converted] }
      responses:
        "200":
          description: Записи дисциплины
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisciplineRecord"
    post:
      operationId: createDisciplineRecord
      tags: [discipline]
      summary: Добавить запись о дисциплине
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisciplineInput"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineRecord"
        "200":
          description: Результат уже был создан этим ключом запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineRecord"
  /discipline/{id}/revoke:
    post:
      operationId: revokeDisciplineRecord
      tags: [discipline]
      summary: Снять активное взыскание с обязательной причиной
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisciplineRevocationInput"
      responses:
        "200":
          description: Взыскание снято, история сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineRecord"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: Прочитать неизменяемый журнал действий руководства
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [accounts, events, standards, tasks, discipline]
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: События журнала действий, новые сначала
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Получить временную ссылку для загрузки скриншота
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Ссылка для прямой загрузки в файловое хранилище
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Неподдерживаемый файл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Персональные уведомления текущего пользователя
      responses:
        "200":
          description: Уведомления
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Отметить уведомление прочитанным
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Уведомление отмечено прочитанным
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Отметить все уведомления прочитанными
      responses:
        "200":
          description: Уведомления отмечены прочитанными
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SetupStatus:
      type: object
      required: [setupComplete]
      properties:
        setupComplete:
          type: boolean
    UserRole:
      type: string
      enum: [leader, admin, employee]
    AccountStatus:
      type: string
      enum: [active, blocked, removed]
    SessionUser:
      type: object
      required: [id, nickname, role, rank, status, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        rank: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        mustChangePassword: { type: boolean }
    LoginInput:
      type: object
      required: [nickname, password]
      properties:
        nickname: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    Dashboard:
      type: object
